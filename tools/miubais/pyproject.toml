[project]
name = "miubais"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27",
    "pydantic>=2.14",
    "pyyaml>=6",
    "python-frontmatter>=1.1",
    "httpx>=0.28",
    "fastapi>=0.143",
    "uvicorn>=0.30",
    "claude-agent-sdk>=0.2.168",
]

[project.scripts]
miubais = "miubais.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miubais"]

[project]
name = "miubais-root"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["miubais", "harnesskit"]

[tool.uv.workspace]
members = ["tools/miubais", "fixtures/harnesskit"]

[tool.uv.sources]
miubais = { workspace = true }
harnesskit = { workspace = true }

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]
exercises = [
    "anthropic==1.15.0",
    "fastembed==0.9.0",
    "httpx2>=2.13",
    "numpy>=1.26",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pyyaml>=6",
]

[tool.uv]
default-groups = ["dev", "exercises"]

[tool.pytest.ini_options]
testpaths = ["tools/miubais/tests", "fixtures/harnesskit/tests"]
norecursedirs = [".*", "node_modules", "tools/miubais/tests/fixtures"]
markers = [
    "live: needs claude auth or a service",
    "slow: spawns nested uv or pytest runs; skipped by scripts/verify.sh --fast",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

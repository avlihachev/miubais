[project]
name = "tinyshop"
version = "0.1.0"
description = "A tiny shop with three planted bugs, used as the target of harness runs."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

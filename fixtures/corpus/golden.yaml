# golden set for the m4 retrieval lab: 48 hand-written queries over fixtures/corpus.
# relevance = a chunk of doc_id contains anchor (case-insensitive, whitespace-normalised).
queries:
- id: q01
  query: Why is reading the input fast on a GPU while writing the reply is slow?
  doc_id: m0-01-tokens-prefill-decode
  anchor: Prefill is compute-bound. All N prompt tokens go through each weight matrix together
  kind: conceptual
- id: q02
  query: What does stop_reason model_context_window_exceeded mean?
  doc_id: m0-01-tokens-prefill-decode
  anchor: '`refusal` and `model_context_window_exceeded`; the last one means the response filled the context window'
  kind: lexical
